name: checkup360-e2e

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_e2e_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  engine:
    image: ${IMAGE_REGISTRY:-ghcr.io/owner}/engine:${ENGINE_VERSION:-latest}
    ports:
      - "${ENGINE_HOST_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/').status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io/owner}/backend:${BACKEND_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175}
      AUTH_COOKIE_SECURE: "false"
      PORT: "8000"
      
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL:-}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD:-}
      SEED_ORG_SLUG: ${SEED_ORG_SLUG:-}
      SEED_ORG_NAME: ${SEED_ORG_NAME:-}
      SEED_OVERWRITE: ${SEED_OVERWRITE:-false}
      ENGINE_API_URL: http://engine:8001
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
    ports:
      - "${BACKEND_HOST_PORT:-8000}:8000"
    volumes:
      - backend_e2e_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/').status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/owner}/frontends-web:${FRONTENDS_VERSION:-latest}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_HOST_PORT:-5173}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  dashboard:
    image: ${IMAGE_REGISTRY:-ghcr.io/owner}/frontends-dashboard:${FRONTENDS_VERSION:-latest}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${DASHBOARD_HOST_PORT:-5174}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  backoffice:
    image: ${IMAGE_REGISTRY:-ghcr.io/owner}/frontends-backoffice:${FRONTENDS_VERSION:-latest}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BACKOFFICE_HOST_PORT:-5175}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

  cms:
    image: ${IMAGE_REGISTRY:-ghcr.io/owner}/cms:${CMS_VERSION:-latest}
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-e2e-insecure-payload-secret}
      AUTH_SECRET: ${AUTH_SECRET}
      BACKEND_URL: http://backend:8000
      AUTH_COOKIE_NAME: auth
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${CMS_HOST_PORT:-3000}:3000"
    volumes:
      - cms_e2e_media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  postgres_e2e_data:
  backend_e2e_uploads:
  cms_e2e_media:

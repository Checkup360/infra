all:
  children:
    staging:
      hosts:
        staging_server:
          ansible_host: "{{ server_host | default(lookup('env', 'DEPLOY_SERVER_HOST')) }}"
          ansible_user: "{{ deploy_user | default(lookup('env', 'DEPLOY_SSH_USER')) | default('ubuntu', true) }}"
          ansible_python_interpreter: /usr/bin/python3
    prod:
      hosts:
        prod_server:
          ansible_host: "{{ server_host | default(lookup('env', 'DEPLOY_SERVER_HOST')) }}"
          ansible_user: "{{ deploy_user | default(lookup('env', 'DEPLOY_SSH_USER')) | default('ubuntu', true) }}"
          ansible_python_interpreter: /usr/bin/python3

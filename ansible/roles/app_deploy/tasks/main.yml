---
- name: Ensure deployment directory and subdirectories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ deploy_dir }}"
    - "{{ deploy_dir }}/caddy"

- name: Copy docker-compose.yml to server
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: "{{ deploy_dir }}/docker-compose.yml"
    mode: "0644"

- name: Copy Caddyfile to server
  ansible.builtin.copy:
    src: Caddyfile
    dest: "{{ deploy_dir }}/caddy/Caddyfile"
    mode: "0644"
  notify: Reload Caddy

- name: Render .env file from template
  ansible.builtin.template:
    src: env.j2
    dest: "{{ deploy_dir }}/.env"
    mode: "0600"

- name: Log in to GitHub Container Registry (GHCR)
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ github_actor | default(lookup('env', 'GITHUB_ACTOR')) }}"
    password: "{{ org_pat | default(lookup('env', 'ORG_PAT')) }}"
  no_log: true

- name: Pull updated container images
  community.docker.docker_compose_v2_pull:
    project_src: "{{ deploy_dir }}"
    policy: always

- name: Start or update services
  community.docker.docker_compose_v2:
    project_src: "{{ deploy_dir }}"
    state: present
    remove_orphans: true

- name: Apply any pending handlers (e.g. reload Caddy if config changed)
  ansible.builtin.meta: flush_handlers

- name: Verify deployment health (API + DB)
  ansible.builtin.uri:
    url: "https://{{ api_host }}/health"
    status_code: 200
  register: health_check
  until: (health_check.status | default(0)) == 200
  retries: 10
  delay: 3
  delegate_to: localhost
  become: false

- name: Prune unused Docker images older than 7 days
  ansible.builtin.command:
    cmd: "docker image prune -af --filter until=168h"
  register: prune_result
  changed_when: "'Total reclaimed space: 0B' not in prune_result.stdout"

name: checkup360

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  engine:
    image: ${IMAGE_REGISTRY}/engine:${ENGINE_VERSION:-latest}
    restart: unless-stopped
    expose:
      - "8001"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/').status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 30

  backend:
    image: ${IMAGE_REGISTRY}/backend:${BACKEND_VERSION}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AUTH_COOKIE_SECURE: "true"
      PORT: "8000"
      SUPERUSER_EMAIL: ${SUPERUSER_EMAIL}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
      SEED_OVERWRITE: ${SEED_OVERWRITE:-false}
      ENGINE_API_URL: http://engine:8001
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/').status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    image: ${IMAGE_REGISTRY}/frontends-web:${FRONTENDS_VERSION}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"

  dashboard:
    image: ${IMAGE_REGISTRY}/frontends-dashboard:${FRONTENDS_VERSION}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"

  backoffice:
    image: ${IMAGE_REGISTRY}/frontends-backoffice:${FRONTENDS_VERSION}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      DOZZLE_BASE: /dozzle
      DOZZLE_AUTH_PROVIDER: forward-proxy
      DOZZLE_ENABLE_ACTIONS: "false"
    expose:
      - "8080"

  caddy:
    image: caddy:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
      dashboard:
        condition: service_started
      backoffice:
        condition: service_started
      cms:
        condition: service_started
      dozzle:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - API_HOST=${API_HOST}
      - DASHBOARD_HOST=${DASHBOARD_HOST}
      - BACKOFFICE_HOST=${BACKOFFICE_HOST}
      - WEB_HOST=${WEB_HOST}
      - CMS_HOST=${CMS_HOST}
      - CADDY_EMAIL=${CADDY_EMAIL}

  cms:
    image: ${IMAGE_REGISTRY}/cms:${CMS_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      BACKEND_URL: http://backend:8000
      AUTH_COOKIE_NAME: auth
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    expose:
      - "3000"
    volumes:
      - cms_media:/app/media

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  cms_media:

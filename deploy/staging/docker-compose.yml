name: checkup360-staging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    image: ${IMAGE_REGISTRY}/backend:${BACKEND_VERSION}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      AUTH_SECRET: ${AUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      PUBLIC_WEB_ORIGIN: ${PUBLIC_WEB_ORIGIN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      AUTH_COOKIE_SECURE: "true"
      PORT: "8000"
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/').status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 30

  web:
    image: ${IMAGE_REGISTRY}/frontends-web:${FRONTENDS_VERSION}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"

  dashboard:
    image: ${IMAGE_REGISTRY}/frontends-dashboard:${FRONTENDS_VERSION}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"

  backoffice:
    image: ${IMAGE_REGISTRY}/frontends-backoffice:${FRONTENDS_VERSION}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - web
      - dashboard
      - backoffice
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:rw
      - nginx_cache:/var/cache/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
    environment:
      - CERT_DOMAIN=${CERT_DOMAIN}
      - API_HOST=${API_HOST}
      - WEB_HOST=${WEB_HOST}
      - DASHBOARD_HOST=${DASHBOARD_HOST}
      - BACKOFFICE_HOST=${BACKOFFICE_HOST}
    command: /bin/sh -c 'envsubst < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g "daemon off;"'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_staging_data:
  nginx_cache:

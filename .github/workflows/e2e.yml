name: E2E

on:
  workflow_dispatch:
    inputs:
      backend_version:
        description: "Backend image tag in GHCR (e.g. v1.2.3)"
        required: true
        default: latest
      frontends_version:
        description: "Frontend image tag in GHCR (e.g. v1.2.3)"
        required: true
        default: latest
      backend_repo:
        description: "Repo (owner/name) hosting the backend image"
        required: true
        default: Checkup360/backend
      frontends_owner:
        description: "GHCR owner of the frontends-* images"
        required: true
        default: Checkup360
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  COMPOSE_FILE_BASE: docker-compose.e2e.yml
  COMPOSE_FILE_LOCAL: docker-compose.e2e.local.yml

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout infra
        uses: actions/checkout@v4
        with:
          path: infra

      - name: Checkout backend (build mode)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/backend
          path: backend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout frontends (build mode)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/frontends
          path: frontends
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR (pull mode)
        if: github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Render .env.e2e
        working-directory: infra
        run: |
          cp .env.e2e.example .env.e2e
          # Make the suite address the public host ports we publish below.
          {
            echo "POSTGRES_USER=postgres"
            echo "POSTGRES_PASSWORD=postgres"
            echo "POSTGRES_DB=appdb_e2e"
            echo "AUTH_SECRET=ci-insecure-secret"
            echo "GOOGLE_CLIENT_ID=ci-google-client-id"
            echo "GOOGLE_CLIENT_SECRET=ci-google-client-secret"
            echo "SUPERUSER_EMAIL=e2e-admin@example.com"
            echo "SUPERUSER_PASSWORD=E2E-Admin-123!"
            echo "PUBLIC_API_ORIGIN=http://localhost:8000"
            echo "PUBLIC_WEB_ORIGIN=http://localhost:5173"
            echo "PUBLIC_DASHBOARD_ORIGIN=http://localhost:5174"
            echo "PUBLIC_BACKOFFICE_ORIGIN=http://localhost:5175"
            echo "CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:5175"
            echo "IMAGE_REGISTRY=ghcr.io/${{ inputs.frontends_owner || github.repository_owner }}"
            echo "BACKEND_VERSION=${{ inputs.backend_version || 'latest' }}"
            echo "FRONTENDS_VERSION=${{ inputs.frontends_version || 'latest' }}"
          } >> .env.e2e

      - name: Bring up the stack (pull mode)
        if: github.event_name == 'workflow_dispatch'
        working-directory: infra
        run: |
          docker compose -f $COMPOSE_FILE_BASE --env-file .env.e2e pull
          docker compose -f $COMPOSE_FILE_BASE --env-file .env.e2e up -d \
            db backend web dashboard backoffice

      - name: Bring up the stack (build mode)
        if: github.event_name != 'workflow_dispatch'
        working-directory: infra
        run: |
          docker compose -f $COMPOSE_FILE_BASE -f $COMPOSE_FILE_LOCAL --env-file .env.e2e build
          docker compose -f $COMPOSE_FILE_BASE -f $COMPOSE_FILE_LOCAL --env-file .env.e2e up -d \
            db backend web dashboard backoffice

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright dependencies
        working-directory: infra/e2e
        run: |
          pnpm install --no-frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: infra/e2e
        env:
          PUBLIC_API_ORIGIN: http://localhost:8000
          PUBLIC_WEB_ORIGIN: http://localhost:5173
          PUBLIC_DASHBOARD_ORIGIN: http://localhost:5174
          PUBLIC_BACKOFFICE_ORIGIN: http://localhost:5175
          SUPERUSER_EMAIL: e2e-admin@example.com
          SUPERUSER_PASSWORD: E2E-Admin-123!
          CI: "true"
        run: pnpm test

      - name: Dump compose logs on failure
        if: failure()
        working-directory: infra
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            docker compose -f $COMPOSE_FILE_BASE --env-file .env.e2e logs --no-color
          else
            docker compose -f $COMPOSE_FILE_BASE -f $COMPOSE_FILE_LOCAL --env-file .env.e2e logs --no-color
          fi

      - name: Tear down
        if: always()
        working-directory: infra
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            docker compose -f $COMPOSE_FILE_BASE --env-file .env.e2e down -v
          else
            docker compose -f $COMPOSE_FILE_BASE -f $COMPOSE_FILE_LOCAL --env-file .env.e2e down -v
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: infra/e2e/playwright-report
          retention-days: 7
          if-no-files-found: ignore

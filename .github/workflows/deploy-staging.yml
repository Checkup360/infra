name: Deploy to Staging

on:
  workflow_dispatch:
    inputs:
      backend_version:
        description: "Backend image tag (e.g., v1.2.3)"
        required: true
      frontends_version:
        description: "Frontends image tag (e.g., v1.2.3)"
        required: true

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-staging-core.yml
    with:
      backend_version: ${{ inputs.backend_version }}
      frontends_version: ${{ inputs.frontends_version }}
    secrets: inherit
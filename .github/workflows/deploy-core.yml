name: Deploy Core
on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (staging or prod)"
        required: true
        type: string
      backend_version:
        required: true
        type: string
      frontends_version:
        required: true
        type: string
      cms_version:
        required: true
        type: string
      engine_version:
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Install Ansible
        run: pipx install ansible-core

      - name: Create Vault password file
        run: echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > /tmp/.vault_pass

      - name: Run Ansible Deploy
        run: |
          ansible-playbook -i ansible/inventory/hosts.yml ansible/deploy.yml \
            -l ${{ inputs.environment }} \
            --vault-password-file /tmp/.vault_pass \
            -e "backend_version=${{ inputs.backend_version }}" \
            -e "frontends_version=${{ inputs.frontends_version }}" \
            -e "cms_version=${{ inputs.cms_version }}" \
            -e "engine_version=${{ inputs.engine_version }}"
        env:
          ANSIBLE_CONFIG: "ansible/ansible.cfg"
          DEPLOY_SERVER_HOST: ${{ secrets.DEPLOY_SERVER_HOST }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          ORG_PAT: ${{ secrets.ORG_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
          ANSIBLE_HOST_KEY_CHECKING: "False"

      - name: Cleanup Vault password file
        if: always()
        run: rm -f /tmp/.vault_pass
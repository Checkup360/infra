name: Deploy Core
on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (staging or prod)"
        required: true
        type: string
      backend_version:
        required: true
        type: string
      frontends_version:
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          BACKEND_VERSION: ${{ inputs.backend_version }}
          FRONTENDS_VERSION: ${{ inputs.frontends_version }}
          ORG_PAT: ${{ secrets.ORG_PAT }}
          GITHUB_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.DEPLOY_SERVER_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: ENV_FILE,BACKEND_VERSION,FRONTENDS_VERSION,ORG_PAT,GITHUB_ACTOR
          script: |
            {
              echo "$ENV_FILE"
              echo "IMAGE_REGISTRY=ghcr.io/checkup360"
              echo "BACKEND_VERSION=$BACKEND_VERSION"
              echo "FRONTENDS_VERSION=$FRONTENDS_VERSION"
            } > /opt/app/deploy/${{ inputs.environment }}/.env
            echo "$ORG_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            cd /opt/app/deploy/${{ inputs.environment }}
            docker compose pull || exit 1
            docker compose up -d
      - name: Verify deployment
        run: |
          for i in $(seq 1 10); do
            if curl -sf https://${{ secrets.API_HOST }}/docs > /dev/null; then
              echo "Deployment verified successfully"
              exit 0
            fi
            sleep 3
          done
          exit 1